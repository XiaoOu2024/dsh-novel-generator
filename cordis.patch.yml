# Two rows, so the plugin list shows them together under 小说工坊 and each can be
# switched independently:
#
#   1. `dsh-novel-generator` — the studio itself (timeline, chapters, snapshots).
#   2. `preset-novel-studio-author` — the author preset, owned by the companion
#      package `dsh-novel-author-preset`. The row names that package (not the
#      generic `@deepseek-ai/dsh-agent-preset`) so the plugin list shows its own
#      title and description; the package registers the preset when it activates
#      and withdraws it when the row is switched off.
#
# The companion package is a dependency of this one, so installing the studio
# brings the preset with it.
- insert:
    - id: dsh-novel-generator
      name: 'dsh-novel-generator'
      config: {}
    - id: preset-novel-studio-author
      name: 'dsh-novel-author-preset'
      config: {}
